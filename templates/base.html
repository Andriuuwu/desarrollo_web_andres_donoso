<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Avistamiento de Aves{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portada.css') }}">
    {% block css %}{% endblock %}
</head>
<body>
    <header>
        <h1>Sistema de Avistamiento de Aves</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('portada') }}">Inicio</a></li>
                <li><a href="{{ url_for('registro') }}">Registrar Voluntario</a></li>
                <li><a href="{{ url_for('avistamiento') }}">Informar Avistamiento</a></li>
                <li><a href="#">Estadísticas</a></li>
                <li><a href="{{ url_for('listado') }}">Listado Avistamientos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
