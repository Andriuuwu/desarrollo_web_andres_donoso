<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registrar Avistamiento</title>
    <link rel="stylesheet" type="text/css" href="./css/avistamiento.css">
</head>
<body>
    <main class="contAvistamiento">
        <h1 id="tituloAvistamiento">Registrar Avistamiento</h1>
        <section id="formAvistamiento">
            <h2 id="textoObligatorio">Campo obligatorio (*)</h2>
            <div id="cajaVal" hidden>
            <p id="msgVal"></p>
            <ul id="listVal"></ul>
            </div>
            <form name="avisForm">
                <label for="nombreAve">Nombre del Ave*</label>
                <input type="text" name="nombreAve" id="nombreAve" minlength="3" required><br>

                <label for="tipoAve">Tipo del Ave*</label>
                <select name="tipoAve" id="tipoAve" required>
                    <option value="">Seleccione el tipo del Ave</option>
                    <option value="acuatica">Acuatica</option>
                    <option value="andina">Andina/Altiplanica</option>
                    <option value="migratoria">Migratoria</option>
                    <option value="nocturna">Nocturna</option>
                    <option value="otra">Otra</option>
                    <option value="paseriforme">Paseriforme</option>
                    <option value="playera">Playera/Costera</option>
                    <option value="rapaz">Rapaz</option>
                </select><br>

                <label for="lugar">Lugar del Avistamiento*</label>
                <input type="text" name="lugar" id="lugar" minlength="4" required><br>

                <label for="fecha">Fecha del Avistamiento*</label>
                <input type="date" name="fecha" id="fecha" required><br>

                <label for="hora">Hora del Avistamiento*</label>
                <input type="time" name="hora" id="hora" required><br>

                <label for="archivoAve">Registro del Ave*</label>
                <input type="file" name="archivoAve" id="archivoAve" multiple accept = "image/*, video/*" required><br>

                <button id="avisButton" type="button">Enviar</button>
            </form>
        </section>
        <div id="botonNavegacion">
            <a href="listado.html">Ver Listado</a>
            <a href="indicadores.html">Ver Metricas</a>
        </div>
    </main>
    <script src="./js/avistamiento.js"></script>
</body>
</html>
